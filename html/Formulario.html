<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Buscamos jugadores! Rellena el formulario para pertenecer a los Muchachos del calavera</title>
    <link rel="stylesheet" href="../CSS/bootstrap.min.css">
    <link rel="stylesheet" href="../CSS/estilos-formulario.css">
</head>
    <header>
  <h1 class="text-primary">¡Buscamos jugadores para nuestro club! Rellena el formulario para pertenecer a los Muchachos del calavera</h1>
    </header>
    <br>
    <form >
    <fieldset>
        <div>
        <label for="Nombre" class="form-label mt-4">Nombre</label>
        <input type="text" class="form-control" id="Nombre" aria-describedby="emailHelp" placeholder="Escribe tu nombre">
        </div>
        <div>
        <label for="Apellido" class="form-label mt-4">Apellido</label>
        <input type="text" class="form-control" id="Apellido" aria-describedby="emailHelp" placeholder="Escribe tu nombre">
        </div>
        <div>
        <label for="Posición" class="form-label mt-4">Posición</label>
        <input type="text" class="form-control" id="Posición" aria-describedby="Posición" placeholder="De que juegas en el campo">
        </div>
        <div>
        <label for="Email1" class="form-label mt-4">Email</label>
        <input type="text" class="form-control" id="Email1" aria-describedby="emailHelp" placeholder="Escribe tu email">
        <small id="emailHelp" class="form-text text-muted">Nunca compartiremos tu correo electrónico.</small>
        </div>
        <div>
        <label for="Equipo" class="form-label mt-4">Equipo actual</label>
        <input type="text" class="form-control" id="Equipo" placeholder="¿En que equipo juegas?" autocomplete="off">
        </div>
        <div>
        <label for="Sexo" class="form-label mt-4">Sexo</label>
        <select class="form-select" id="Sexo">
            <option>Hombre</option>
            <option>Mujer</option>
        </select>
        </div>
        <div>
        <label for="Edad" class="form-label mt-4">Edad</label>
        <input type="text" class="form-control" id="Edad" placeholder="Escribe tu edad" autocomplete="off">
        </div>
        <div>
        <label for="Nacionalidad" class="form-label mt-4">Nacionalidad</label>
        <input type="text" class="form-control" id="Nacionalidad" placeholder="¿En que país vives?" autocomplete="off">
        </div>
        <div>
        <label for="exampleSelect2" class="form-label mt-4">Virtudes</label>
        <select multiple="" class="form-select" id="exampleSelect2">
            <option>Goleador</option>
            <option>Creador de asistencias</option>
            <option>Rompe piernas</option>
            <option>Portero</option>
            <option>Mundo_banquillo</option>
        </select>
        </div>
        <div>
        <label for="exampleTextarea" class="form-label mt-4">Añade algo que nos quieras comentar</label>
        <textarea class="form-control" id="exampleTextarea" rows="3"></textarea>
        </div>
        <div>
        <label for="formFile" class="form-label mt-4">Suba sus mejores jugadas</label>
        <input class="form-control" type="file" id="formFile">
        </div>
        <div>
        <br>
        <button type="submit" class="btn btn-primary">Submit</button>
        </div>
    </fieldset>
    </form>
        <br>
        <br>
        <nav>
        <a href="../index.html">Acceder a la pagina principal</a>
        </nav>
        <br>
        <footer>
                Página creada por Mateo Rubiales Montes y Ángel González López
        </footer>
        </body>
        </html>
